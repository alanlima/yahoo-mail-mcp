name: Infrastructure

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infrastructure.yml']
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to plan or apply
        required: true
        type: choice
        options: [foundation, application]
      apply:
        description: Re-plan and apply after reviewing the summary
        required: true
        type: boolean
        default: false
      image_digest:
        description: Immutable application image digest
        required: true
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  ARM_USE_OIDC: 'true'
  TF_VAR_use_oidc: 'true'
  TF_VAR_global_suffix: ${{ vars.TF_GLOBAL_SUFFIX }}
  TF_VAR_repository: ${{ github.repository }}
  TF_VAR_owner: ${{ vars.RESOURCE_OWNER }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_tf_state_bucket: lima-terraform-states
  TF_VAR_mcp_fqdn: ${{ vars.MCP_FQDN }}
  TF_VAR_mcp_oauth_enabled: 'true'
  TF_VAR_mcp_oauth_tenant_id: ${{ vars.AZURE_TENANT_ID }}
  TF_VAR_mcp_oauth_audience: ${{ vars.MCP_OAUTH_CLIENT_ID }}
  TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_cloudfront_enabled: ${{ vars.CLOUDFRONT_ENABLED || 'false' }}
  TF_VAR_cloudfront_route53_cutover: ${{ vars.CLOUDFRONT_ROUTE53_CUTOVER || 'false' }}
  TF_VAR_origin_protection_enabled: ${{ vars.ORIGIN_PROTECTION_ENABLED || 'false' }}
  TF_VAR_origin_verification_header_value: ${{ secrets.ORIGIN_VERIFICATION_HEADER_VALUE }}
  TF_VAR_image_digest: ${{ inputs.image_digest || 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        stack: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.stack) || '["foundation","application"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to AWS for state and application DNS
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
      - name: Initialize remote state
        run: >-
          terraform -chdir=infra/terraform/${{ matrix.stack }} init
          -backend-config="bucket=lima-terraform-states"
          -backend-config="key=yahoo-mail-mcp/prod/${{ matrix.stack }}.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Validate and plan
        run: |
          terraform -chdir=infra/terraform/${{ matrix.stack }} validate
          terraform -chdir=infra/terraform/${{ matrix.stack }} plan -out=${{ matrix.stack }}.tfplan
          terraform -chdir=infra/terraform/${{ matrix.stack }} show -no-color ${{ matrix.stack }}.tfplan > infra/terraform/${{ matrix.stack }}/${{ matrix.stack }}.plan.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-${{ matrix.stack }}-plan-summary
          path: infra/terraform/${{ matrix.stack }}/${{ matrix.stack }}.plan.txt
          retention-days: 3

  apply-foundation:
    if: github.event_name == 'workflow_dispatch' && inputs.stack == 'foundation' && inputs.apply && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
      - name: Re-plan and apply foundation after approval
        run: |
          terraform -chdir=infra/terraform/foundation init -backend-config="bucket=lima-terraform-states" -backend-config="key=yahoo-mail-mcp/prod/foundation.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=infra/terraform/foundation plan -out=foundation.tfplan
          terraform -chdir=infra/terraform/foundation apply foundation.tfplan

  apply-application:
    if: github.event_name == 'workflow_dispatch' && inputs.stack == 'application' && inputs.apply && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
      - name: Verify secret provisioning gate
        run: |
          for secret in yahoo-email yahoo-app-password mcp-bearer-token cursor-signing-key mcp-oauth-client-id mcp-oauth-client-secret; do
            az keyvault secret show --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" --name "$secret" --query id --output tsv >/dev/null
          done
          if [[ "${{ vars.ORIGIN_PROTECTION_ENABLED }}" == "true" ]]; then
            az keyvault secret show --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" --name origin-verification-header --query id --output tsv >/dev/null
          fi
      - name: Re-plan and apply application after approval
        run: |
          terraform -chdir=infra/terraform/application init -backend-config="bucket=lima-terraform-states" -backend-config="key=yahoo-mail-mcp/prod/application.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform -chdir=infra/terraform/application plan -out=application.tfplan
          terraform -chdir=infra/terraform/application apply application.tfplan
