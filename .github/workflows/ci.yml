name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      RUN_IMAP_INTEGRATION_TESTS: 'true'
      RUN_ASPIRE_CLOSED_BOX_TESTS: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Build with warnings as errors
        run: dotnet build --configuration Release --no-restore
      - name: Test with coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Enforce no-delete guardrail
        shell: pwsh
        run: ./scripts/Check-NoDelete.ps1
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./src/YahooMailMcp.Server.Http/Dockerfile
          load: true
          push: false
          tags: yahoo-mail-mcp:ci
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            IMAGE_VERSION=ci-${{ github.run_number }}
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yahoo-mail-mcp:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: yahoo-mail-mcp:ci
          format: spdx-json
          output-file: yahoo-mail-mcp.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sbom
          path: yahoo-mail-mcp.spdx.json
          retention-days: 14

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          for stack in foundation application; do
            terraform -chdir="infra/terraform/${stack}" init -backend=false -input=false
            terraform -chdir="infra/terraform/${stack}" validate
          done
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
